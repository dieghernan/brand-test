project:
  type: website

website:
  title: "Simple Brand Example"
  page-navigation: true
  bread-crumbs: true
  navbar:
    title: "dieghernan"
    toggle-position: right
    tools:
    - icon: home
      href: https://dieghernan.github.io
    - icon: github
      href: https://github.com/dieghernan/
    search: true
    right:
    - text: Test files
      menu:
      - docs/quarto-features.qmd
      - docs/highlight.qmd
      - docs/about.qmd
  favicon: ./assets/favicon.png
  sidebar:
    contents: auto
  page-footer:
    left: "This is a test footer"
    right: >
      Visit <a href="https://posit-dev.github.io/brand-yml/">brand-yml</a> for
      more info.

format:
  html:
    css: styles.css
    respect-user-color-scheme: true
    toc: true
    highlight-style: ayu

editor: visual

brand:
  light: _brand.yml
  dark: _brand-dark.yml
