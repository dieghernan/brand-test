on:
  workflow_dispatch:
  push:
    branches: [main]

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2

    - uses: r-lib/actions/setup-pandoc@v2

    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    - name: Restore R package cache
      uses: actions/cache@v5
      with:
        path: ${{ env.R_LIBS_USER }}
        key: ${{ runner.os }}-${{ hashFiles('quarto-features.qmd') }}
        restore-keys: ${{ runner.os }}-${{ hashFiles('quarto-features.qmd') }}
    - name: Install pak
      run: |
        # Install pak
        cat("::group::Install pak\n")
        install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))
        cat("::endgroup::\n")
        
      shell: Rscript {0}

    - name: Install dependencies
      run: |
  
        cat("::group::Install/update packages\n")
        cat("os-version=", sessionInfo()$running, "\n")
        # Install/Update packages
        Sys.setenv("PKGCACHE_HTTP_VERSION" = "2")
        pak::pkg_install(c("knitr", "rmarkdown", "quarto", "yaml", 
        "cli", "pkgdown"), upgrade = TRUE, dependencies = TRUE)
        cat("::endgroup::\n")

      shell: Rscript {0}

    - name: Render and Publish
      uses: quarto-dev/quarto-actions/publish@v2
      with:
        target: gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
